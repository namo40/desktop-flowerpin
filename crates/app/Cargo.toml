[package]
name = "desktop-flowerpin"
description = "꽃핀 데스크탑 캐릭터"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "DesktopFlowerpin"
path = "src/main.rs"

[dependencies]
dfp-pack = { path = "../pack" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
