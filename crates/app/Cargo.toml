[package]
name = "desktop-flowerpin"
description = "꽃핀 데스크탑 캐릭터"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "DesktopFlowerpin"
path = "src/main.rs"

[build-dependencies]
# 설정 창의 틀(.rc)과 manifest를 exe에 넣는다. Windows SDK의 rc.exe를 쓴다.
embed-resource = "3"
# 빌드할 때 키를 두 조각으로 나누고, 공식 빌드에 써도 되는 키와 팩인지 검사한다.
dfp-pack = { path = "../pack" }
getrandom = "0.4"

[dependencies]
dfp-pack = { path = "../pack" }
# 설정 파일과 방송 상태 응답을 읽는다. 값을 하나씩 꺼내 쓰므로 serde의 자동 변환(derive)은 넣지 않는다.
serde_json = { version = "1", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
